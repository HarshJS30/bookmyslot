name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mydatabase
      REDIS_URL: redis://localhost:6379
      BASE_URL: http://localhost:3000
      AUTH_SECRET: super_secret_ci_string
      AUTH_TRUST_HOST: "true"
      AUTH_GITHUB_ID: x
      AUTH_GITHUB_SECRET: x
      CRON_SECRET: x
      NEXT_PUBLIC_REALTIME_URL: http://localhost:4000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Linux native binaries
        run: |
          npm install --no-save lightningcss-linux-x64-gnu@$(node -p "JSON.parse(require('fs').readFileSync('node_modules/lightningcss/package.json')).version") @tailwindcss/oxide-linux-x64-gnu@$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@tailwindcss/oxide/package.json')).version")

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build the app
        run: npm run build

      - name: Start the app and wait for it
        run: |
          npm start &
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://localhost:3000/api/health

      - name: Run P0 tests
        run: npm run test:p0

      - name: Run breaking changes tests
        run: npm run test:break

      - name: Load seed data
        env:
          USERS: 200
          SEATS: 5000
        run: npm run seed:load

      - name: Run confirmation tests
        env:
          USERS: 200
          SEATS: 5000
        run: npm run test:confirm