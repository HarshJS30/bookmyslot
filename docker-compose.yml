services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase

  realtime:
    build: ./realtime-server
    ports:
      - "4000:4000"
    environment:
      REDIS_URL: redis://redis:6379
      FRONTEND_ORIGIN: http://localhost:8080   # browsers now arrive through nginx
    depends_on:
      - redis

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_REALTIME_URL: http://localhost:4000
    expose:
      - "3000"            # replaces "3000:3000" so copies don't clash
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydatabase
      REDIS_URL: redis://redis:6379
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "local-dev-secret-change-me-7f3a9c2e"
      CRON_SECRET: x
      AUTH_GITHUB_ID: x
      AUTH_GITHUB_SECRET: x
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app